<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Missão Santa Faustina — comunidade católica em Fazenda Rio Grande, PR, reunida pela fé e devoção à Divina Misericórdia." />
    <title>Missão Santa Faustina</title>
    <script>
      (function () {
        var stored = localStorage.getItem('msf-theme')
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <script>
      // Restore the real path after the GitHub Pages 404.html SPA redirect
      // (see public/404.html) so BrowserRouter sees the intended URL.
      ;(function () {
        var l = window.location
        var params = new URLSearchParams(l.search)
        var p = params.get('p')
        if (p) {
          var q = params.get('q')
          window.history.replaceState(null, '', l.pathname.replace(/\/$/, '') + p + (q ? '?' + q : '') + l.hash)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
