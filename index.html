    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Church",
        "name": "Missão Santa Faustina",
        "url": "https://santafaustinafrg.com.br/",
        "description": "Comunidade católica em Fazenda Rio Grande, PR, reunida pela fé e devoção à Divina Misericórdia.",

      }
    </script>
    <script>
      (function () {
        // Dark is the site's default look; only an explicit saved choice overrides it.
        var stored = localStorage.getItem('msf-theme')
        var dark = stored ? stored === 'dark' : true
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <script>
      // Restore the real path after the GitHub Pages 404.html SPA redirect
      // (see public/404.html) so BrowserRouter sees the intended URL.
      ;(function () {
        var l = window.location
        var params = new URLSearchParams(l.search)
        var p = params.get('p')
        if (p) {
          var q = params.get('q')
          window.history.replaceState(null, '', l.pathname.replace(/\/$/, '') + p + (q ? '?' + q : '') + l.hash)
        }
      })()
    </script>
